# Deploys fire to GitHub Pages from a version tag (v*). Every gate must pass or nothing is
# published. Roll back by re-running this workflow on an earlier tag (Actions > Deploy >
# Run workflow, pick the tag). See ship/README.md.
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Only tags deploy
        if: github.ref_type != 'tag'
        run: |
          echo "Deploys run from a version tag (got ${GITHUB_REF}). Pick a tag in 'Use workflow from'."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            front/lint/package-lock.json

      - name: Gate - install exactly the lockfiles (app, and the lint tools in front/lint)
        run: npm run setup

      - name: Gate - tree still clean (lockfile unchanged)
        run: git diff --exit-code

      - name: Gate - typecheck, lint and tests
        run: npm run check

      - name: Gate - no high or critical advisories
        run: npm audit --audit-level=high

      - name: Gate - build and check the output (policy present, no inline code, no external references)
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: front/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
